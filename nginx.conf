server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Reiner Onepager ohne Routing — nur "/" existiert.
    location / {
        try_files $uri $uri/ =404;
    }

    # index.html selbst nicht langfristig cachen, damit Deploys sofort live sind.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Statische Assets (Fonts, CSS, Bilder) sind inhaltsadressiert genug fuer
    # aggressives Caching — bei Aenderung einfach neuen Dateinamen verwenden.
    location ~* \.(css|js|woff2|woff|svg|png|jpg|jpeg|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;
}
